<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>喝水时间 · Drink Time</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1cb0f6">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="喝水时间">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
     font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  :root{
    --bg:#f0f6fb; --card:#ffffff; --ink:#2b3a4a; --muted:#8aa0b4;
    --blue:#1cb0f6; --blue-d:#1592cf; --green:#58cc02; --green-d:#46a302;
    --line:#e8eef3; --soft:#f3f8fc;
  }
  body{ background:var(--bg); color:var(--ink); display:flex; align-items:center;
        justify-content:center; min-height:100vh; padding:0;
        padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .phone{ width:100%; max-width:430px; height:100vh; background:var(--card);
    overflow:hidden; display:flex; flex-direction:column; }
  @media(min-width:460px){ body{padding:18px} .phone{ height:780px; max-height:94vh;
    border-radius:34px; box-shadow:0 24px 70px rgba(40,80,120,.22); } }
  .top{ padding:22px 22px 10px; text-align:center; }
  .top h1{ font-size:21px; font-weight:800; letter-spacing:.5px; }
  .top .s{ color:var(--muted); font-size:12px; margin-top:2px; }
  .pages{ flex:1; overflow-y:auto; padding:8px 18px 20px; }
  .page{ display:none; } .page.on{ display:block; animation:fade .25s; }
  @keyframes fade{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  .btn{ border:none; cursor:pointer; font-weight:800; font-size:15px; color:#fff;
    background:var(--blue); border-radius:16px; padding:14px 10px;
    box-shadow:0 5px 0 var(--blue-d); transition:transform .06s, box-shadow .06s; }
  .btn:active{ transform:translateY(5px); box-shadow:0 0 0 var(--blue-d); }
  .btn.g{ background:var(--green); box-shadow:0 5px 0 var(--green-d); }
  .btn.g:active{ box-shadow:0 0 0 var(--green-d); }
  .btn.ghost{ background:var(--soft); color:var(--ink); box-shadow:0 5px 0 var(--line); }
  .btn.ghost:active{ box-shadow:0 0 0 var(--line); }

  .dropwrap{ width:190px; height:215px; margin:6px auto 0; position:relative; }
  .dropfill{ position:absolute; inset:0; clip-path:url(#dropClip); background:#e8f6fe; }
  .dropfill .lvl{ position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg,#5cc6f7,#1592cf);
    transition:height 1s cubic-bezier(.22,1,.36,1); }
  .lvl::before,.lvl::after{ content:""; position:absolute; left:-50%; width:200%;
    height:30px; top:-15px; background:#7fd2f8; border-radius:42%;
    animation:wv 5s linear infinite; }
  .lvl::after{ animation:wv 8s linear infinite reverse; opacity:.5; top:-11px; }
  @keyframes wv{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .bubble{ position:absolute; bottom:8%; width:9px; height:9px; border-radius:50%;
    background:rgba(255,255,255,.55); animation:rise 3.5s ease-in infinite; }
  @keyframes rise{ 0%{transform:translateY(0);opacity:0}
    15%{opacity:.8} 100%{transform:translateY(-150px);opacity:0} }
  .droptxt{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
    text-shadow:0 1px 4px rgba(255,255,255,.6); }
  .droptxt .n{ font-size:30px; font-weight:800; }
  .droptxt .g2{ font-size:12px; color:#3a6f8c; margin-top:2px; }
  .pct{ text-align:center; font-weight:800; color:var(--blue); margin-top:6px; }
  .raw{ text-align:center; color:var(--muted); font-size:12px; margin-top:3px; }

  .lbl{ display:block; color:var(--muted); font-size:13px; font-weight:700; margin:18px 0 9px; }
  .drinks{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .drink{ text-align:center; padding:10px 4px; border-radius:14px; cursor:pointer;
    background:var(--soft); border:2px solid transparent; font-size:12px;
    color:var(--muted); font-weight:600; transition:.12s; }
  .drink .ic{ font-size:21px; display:block; margin-bottom:3px; }
  .drink.on{ background:#e6f6ff; border-color:var(--blue); color:var(--ink); }
  .drink small{ display:block; font-size:10px; opacity:.7; }
  .quick{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:9px; }
  .inp{ background:var(--soft); border:2px solid var(--line); border-radius:14px;
    color:var(--ink); padding:12px 14px; font-size:15px; outline:none; width:100%; }
  .inp:focus{ border-color:var(--blue); }
  .row{ display:flex; gap:9px; margin-top:10px; align-items:center; }
  .noteline{ display:flex; gap:9px; margin-top:9px; align-items:center; }
  .imgbtn{ flex:0 0 auto; width:50px; height:48px; border-radius:14px; cursor:pointer;
    background:var(--soft); border:2px dashed var(--line); display:flex;
    align-items:center; justify-content:center; font-size:20px; overflow:hidden; }
  .imgbtn img{ width:100%; height:100%; object-fit:cover; }

  .stat-cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sc{ background:var(--soft); border-radius:16px; padding:14px; }
  .sc .v{ font-size:21px; font-weight:800; color:var(--blue); }
  .sc .v small{ font-size:12px; color:var(--muted); font-weight:600; }
  .sc .t{ font-size:12px; color:var(--muted); margin-top:3px; }
  .bd{ display:flex; align-items:center; gap:10px; padding:10px 2px;
    border-bottom:1px solid var(--line); font-size:14px; }
  .bd .ic{ font-size:20px; } .bd .nm{ flex:1; font-weight:600; }
  .bd .mn{ color:var(--blue); font-weight:800; } .bd .ct{ color:var(--muted); font-size:12px; }
  .li{ display:flex; align-items:center; gap:11px; padding:11px 2px;
    border-bottom:1px solid var(--line); }
  .li .th{ width:42px; height:42px; border-radius:12px; flex:0 0 auto;
    background:var(--soft); display:flex; align-items:center; justify-content:center;
    font-size:20px; overflow:hidden; }
  .li .th img{ width:100%; height:100%; object-fit:cover; }
  .li .mid{ flex:1; min-width:0; }
  .li .mid .t1{ font-weight:700; font-size:14px; }
  .li .mid .t2{ color:var(--muted); font-size:12px; margin-top:2px; }
  .li .amt{ color:var(--blue); font-weight:800; font-size:14px; }
  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:34px 0; }

  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-title{ font-size:17px; font-weight:800; cursor:pointer; padding:6px 12px;
    border-radius:12px; background:var(--soft); }
  .nav-a{ width:38px; height:38px; border-radius:12px; background:var(--soft);
    border:none; cursor:pointer; font-size:16px; font-weight:800; color:var(--blue); }
  .wk{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    color:var(--muted); font-size:11px; text-align:center; margin-bottom:6px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    transition:transform .28s, opacity .28s; }
  .cell{ aspect-ratio:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; cursor:pointer; border-radius:12px; position:relative; }
  .cell.dim{ opacity:.28; } .cell.today{ background:#e6f6ff; }
  .cell .ring{ width:34px; height:34px; }
  .cell .dnum{ position:absolute; font-size:11px; font-weight:700; color:var(--ink); }
  .cell.sel{ outline:2px solid var(--blue); }
  .months{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .mo{ background:var(--soft); border-radius:14px; padding:18px 0; text-align:center;
    font-weight:800; cursor:pointer; }
  .mo.cur{ background:#e6f6ff; color:var(--blue); }
  .daybox{ margin-top:14px; background:var(--soft); border-radius:16px; padding:16px;
    text-align:center; }
  .daybox .big{ font-size:24px; font-weight:800; color:var(--blue); }
  .daybox .sm{ color:var(--muted); font-size:12px; margin-top:4px; }

  .field{ display:flex; align-items:center; justify-content:space-between;
    padding:14px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .field span{ color:var(--muted); font-weight:600; } .field .inp{ width:130px; }
  .seg{ display:flex; gap:6px; }
  .seg button{ border:none; cursor:pointer; background:var(--soft); color:var(--muted);
    font-weight:700; font-size:12px; padding:8px 11px; border-radius:11px; }
  .seg button.on{ background:var(--blue); color:#fff; }
  .calc{ margin-top:14px; background:#eafaf0; border:2px solid #cdeede;
    border-radius:14px; padding:13px; font-size:13px; } .calc b{ color:var(--green-d); }
  .sw{ width:48px; height:28px; border-radius:999px; background:var(--line);
    position:relative; cursor:pointer; transition:.2s; flex:0 0 auto; }
  .sw::after{ content:""; position:absolute; width:22px; height:22px; border-radius:50%;
    background:#fff; top:3px; left:3px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .sw.on{ background:var(--green); } .sw.on::after{ transform:translateX(20px); }
  .next{ text-align:center; font-size:13px; color:var(--muted); margin-top:14px; }
  .next b{ color:var(--blue); }

  .nav{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line);
    background:#fff; padding-bottom:env(safe-area-inset-bottom); }
  .nav button{ background:none; border:none; cursor:pointer; padding:11px 0 14px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#b7c6d4; font-size:11px; font-weight:700; transition:color .15s; }
  .nav button svg{ width:23px; height:23px; stroke:currentColor; fill:none;
    stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .nav button.on{ color:var(--blue); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <clipPath id="dropClip" clipPathUnits="objectBoundingBox">
    <path d="M0.5,0.02 C0.5,0.02 0.1,0.43 0.1,0.66 A0.4,0.4 0 1 0 0.9,0.66
             C0.9,0.43 0.5,0.02 0.5,0.02 Z"/>
  </clipPath>
</svg>

<div class="phone">
  <div class="top"><h1>💧 喝水时间</h1><div class="s">Drink Time</div></div>
  <div class="pages">
    <section class="page on" id="p-drink">
      <div class="dropwrap">
        <div class="dropfill"><div class="lvl" id="lvl">
          <span class="bubble" style="left:35%;animation-delay:0s"></span>
          <span class="bubble" style="left:55%;animation-delay:1.2s"></span>
          <span class="bubble" style="left:46%;animation-delay:2.3s"></span>
        </div></div>
        <div class="droptxt"><div class="n"><span id="cur">0</span></div>
          <div class="g2">/ <span id="goalL">2000</span> ml</div></div>
      </div>
      <div class="pct" id="pct">0% 等效水量</div>
      <div class="raw" id="raw">实际喝下 0 ml</div>
      <label class="lbl">① 选饮品（按补水率折算成水）</label>
      <div class="drinks" id="drinks"></div>
      <label class="lbl">② 选量并记录</label>
      <div class="quick">
        <button class="btn" data-add="100">100</button>
        <button class="btn" data-add="330">330</button>
        <button class="btn" data-add="500">500</button>
        <button class="btn" data-add="1000">1000</button>
      </div>
      <div class="noteline">
        <input class="inp" id="noteName" placeholder="备注：具体喝了什么（如 元气森林）">
        <label class="imgbtn" id="imgBtn">📷
          <input type="file" id="imgIn" accept="image/*" hidden></label>
      </div>
      <div class="row">
        <input class="inp" type="number" id="customMl" placeholder="自定义 ml">
        <button class="btn g" id="addCustom" style="flex:0 0 110px">＋ 记一笔</button>
      </div>
    </section>

    <section class="page" id="p-log">
      <label class="lbl">今日概览</label>
      <div class="stat-cards">
        <div class="sc"><div class="v" id="sEff">0<small> ml</small></div><div class="t">等效水量</div></div>
        <div class="sc"><div class="v" id="sRaw">0<small> ml</small></div><div class="t">实际喝下</div></div>
        <div class="sc"><div class="v" id="sPct">0<small> %</small></div><div class="t">目标完成度</div></div>
        <div class="sc"><div class="v" id="sCnt">0<small> 次</small></div><div class="t">饮水次数</div></div>
      </div>
      <label class="lbl">饮品统计（喝了什么 · 大概多少）</label>
      <div id="breakdown"></div>
      <label class="lbl">明细</label>
      <div id="log"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" id="resetBtn" style="flex:1">重置今天</button>
      </div>
    </section>

    <section class="page" id="p-stat">
      <div class="cal-head">
        <button class="nav-a" id="prevBtn">‹</button>
        <div class="cal-title" id="calTitle">2026年5月</div>
        <button class="nav-a" id="nextBtn">›</button>
      </div>
      <div id="monthView">
        <div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="grid" id="grid"></div>
      </div>
      <div id="yearView" style="display:none"><div class="months" id="months"></div></div>
      <div class="daybox" id="dayBox">
        <div class="big" id="dbBig">点选某天查看</div>
        <div class="sm" id="dbSm">日历缩略图用圆环显示当天饮水完成度</div>
      </div>
    </section>

    <section class="page" id="p-set">
      <label class="lbl">按身材 + 运动量算每日目标</label>
      <div class="field"><span>身高 (cm)</span><input class="inp" type="number" id="height" placeholder="如 175"></div>
      <div class="field"><span>体重 (kg)</span><input class="inp" type="number" id="weight" placeholder="如 65"></div>
      <div class="field"><span>每周运动次数</span>
        <div class="seg" id="weekSeg">
          <button data-w="0">0</button><button data-w="2" class="on">1-2</button>
          <button data-w="4">3-4</button><button data-w="6">5+</button>
        </div></div>
      <div class="calc" id="calcBox">填入体重后自动测算建议饮水量</div>
      <button class="btn g" id="applyGoal" style="width:100%; margin-top:12px">采用此目标</button>
      <label class="lbl">提醒</label>
      <div class="field"><span>提醒间隔 (分钟)</span><input class="inp" type="number" id="intervalInput" min="1" step="5" value="60"></div>
      <div class="field"><span>开启定时提醒</span><div class="sw" id="sw"></div></div>
      <div class="next" id="nextHint">提醒未开启</div>
    </section>
  </div>

  <nav class="nav" id="nav">
    <button data-go="drink" class="on">
      <svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>喝水</button>
    <button data-go="log">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>记录</button>
    <button data-go="stat">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>取数</button>
    <button data-go="set">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>设置</button>
  </nav>
</div>

<script>
const KEY="drinkTimeData", $=id=>document.getElementById(id);
const Cap=window.Capacitor;
const isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const LN=()=>Cap&&Cap.Plugins&&Cap.Plugins.LocalNotifications;
const DRINKS=[
  {id:"water",name:"白水",ic:"💧",k:1.00},{id:"tea",name:"茶",ic:"🍵",k:0.90},
  {id:"coffee",name:"咖啡",ic:"☕",k:0.80},{id:"soda",name:"碳酸饮料",ic:"🥤",k:0.70},
  {id:"milk",name:"牛奶",ic:"🥛",k:0.90},{id:"juice",name:"果汁",ic:"🧃",k:0.80},
  {id:"protein",name:"蛋白粉",ic:"🏋️",k:0.75},{id:"sports",name:"运动饮料",ic:"⚡",k:0.95},
];
let curDrink="water", pendImg="";
const todayStr=()=>new Date().toLocaleDateString("sv");

function load(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
  if(d.date!==todayStr()){
    const h=d.history||{};
    if(d.date && d.effective>0) h[d.date]={eff:d.effective,goal:d.goal||2000};
    d={ date:todayStr(), effective:0, raw:0, log:[], history:h,
        goal:d.goal||2000, interval:d.interval||60, remind:d.remind||false,
        height:d.height||"", weight:d.weight||"", weekly:(d.weekly??2) };
  }
  d.goal=d.goal||2000; d.interval=d.interval||60; d.log=d.log||[];
  d.history=d.history||{}; if(d.weekly==null) d.weekly=2;
  return d;
}
function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){ alert("存储已满，图片过多"); } }
let data=load();

function calcGoal(h,w,wk){
  h=parseFloat(h); w=parseFloat(w);
  if(!w||w<=0) return null;
  let g=w*30; if(h>0) g+=(h-150)*8; g+=(+wk)*110;
  return Math.round(Math.max(1200,Math.min(4500,g))/50)*50;
}
function ring(pct,size,sw){
  const r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-Math.min(1,pct/100));
  const col=pct>=100?"#58cc02":"#1cb0f6";
  return `<svg class="ring" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#e8eef3" stroke-width="${sw}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="${sw}"
      fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function buildDrinks(){
  const b=$("drinks"); b.innerHTML="";
  DRINKS.forEach(d=>{
    const e=document.createElement("div");
    e.className="drink"+(d.id===curDrink?" on":"");
    e.innerHTML=`<span class="ic">${d.ic}</span>${d.name}<small>×${d.k}</small>`;
    e.onclick=()=>{ curDrink=d.id; buildDrinks(); };
    b.appendChild(e);
  });
}
function render(){
  const pct=Math.min(100,Math.round(data.effective/data.goal*100));
  $("cur").textContent=data.effective; $("goalL").textContent=data.goal;
  $("lvl").style.height=pct+"%";
  $("pct").textContent=pct+"% "+(pct>=100?"🎉 今日达标！":"等效水量");
  $("raw").textContent="实际喝下 "+data.raw+" ml";
  $("intervalInput").value=data.interval;
  $("height").value=data.height||""; $("weight").value=data.weight||"";
  $("sw").classList.toggle("on",data.remind);
  [...$("weekSeg").children].forEach(b=>b.classList.toggle("on",+b.dataset.w===+data.weekly));
  $("sEff").innerHTML=data.effective+'<small> ml</small>';
  $("sRaw").innerHTML=data.raw+'<small> ml</small>';
  $("sPct").innerHTML=pct+'<small> %</small>';
  $("sCnt").innerHTML=data.log.length+'<small> 次</small>';
  const bx=$("breakdown"); bx.innerHTML=""; const agg={};
  data.log.forEach(e=>{ (agg[e.drinkId]=agg[e.drinkId]||{ml:0,n:0,ic:e.ic,nm:e.name}),
    agg[e.drinkId].ml+=e.ml, agg[e.drinkId].n++; });
  const ks=Object.keys(agg);
  if(!ks.length) bx.innerHTML='<div class="empty">还没有记录</div>';
  ks.forEach(k=>{ const a=agg[k]; const r=document.createElement("div"); r.className="bd";
    r.innerHTML=`<span class="ic">${a.ic}</span><span class="nm">${a.nm}</span>
      <span class="ct">${a.n}次</span><span class="mn">${a.ml} ml</span>`; bx.appendChild(r); });
  const lg=$("log"); lg.innerHTML="";
  if(!data.log.length) lg.innerHTML='<div class="empty">今天还没喝，去“喝水”页记一笔～</div>';
  [...data.log].reverse().forEach(e=>{
    const r=document.createElement("div"); r.className="li";
    const th=e.img?`<img src="${e.img}">`:e.ic;
    r.innerHTML=`<div class="th">${th}</div><div class="mid">
      <div class="t1">${e.note?e.note:e.name}</div>
      <div class="t2">${e.t} · ${e.name} ${e.ml}ml</div></div>
      <div class="amt">+${e.eff}</div>`;
    lg.appendChild(r);
  });
  updateCalc(); if($("p-stat").classList.contains("on")) renderCal();
}
function addDrink(ml){
  ml=parseInt(ml); if(!ml||ml<=0){ alert("请输入毫升数"); return; }
  const d=DRINKS.find(x=>x.id===curDrink)||DRINKS[0];
  data=load();
  data.raw+=ml; const eff=Math.round(ml*d.k); data.effective+=eff;
  data.log.push({ml,eff,name:d.name,drinkId:d.id,ic:d.ic,
    note:$("noteName").value.trim(), img:pendImg,
    t:new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})});
  save(data);
  $("noteName").value=""; pendImg=""; $("imgBtn").innerHTML='📷<input type="file" id="imgIn" accept="image/*" hidden>';
  bindImg(); render();
}
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addDrink(b.dataset.add));
$("addCustom").onclick=()=>{ addDrink($("customMl").value); $("customMl").value=""; };
function bindImg(){
  $("imgBtn").onclick=()=>$("imgIn").click();
  $("imgIn").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{ const im=new Image(); im.onload=()=>{
      const c=document.createElement("canvas"); const m=140;
      const sc=Math.min(m/im.width,m/im.height,1);
      c.width=im.width*sc; c.height=im.height*sc;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      pendImg=c.toDataURL("image/jpeg",0.6);
      $("imgBtn").innerHTML=`<img src="${pendImg}">`;
    }; im.src=ev.target.result; };
    rd.readAsDataURL(f);
  };
}
bindImg();
function updateCalc(){
  const g=calcGoal($("height").value||data.height,$("weight").value||data.weight,data.weekly);
  $("calcBox").innerHTML=g?`建议每日饮水约 <b>${g} ml</b>（当前目标 ${data.goal} ml）`
    :"填入体重后自动测算建议饮水量";
}
["height","weight"].forEach(id=>$(id).addEventListener("input",()=>{
  data=load(); data.height=$("height").value; data.weight=$("weight").value;
  save(data); updateCalc();
}));
$("weekSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  data=load(); data.weekly=+b.dataset.w; save(data); render(); });
$("applyGoal").onclick=()=>{
  const g=calcGoal($("height").value,$("weight").value,data.weekly);
  if(!g){ alert("请先填写体重"); return; }
  data=load(); data.goal=g; save(data); render(); alert("已采用每日目标 "+g+" ml");
};
$("intervalInput").onchange=e=>{ data=load();
  data.interval=Math.max(1,parseInt(e.target.value)||60); save(data);
  if(data.remind) startRem(); };
$("resetBtn").onclick=()=>{ if(!confirm("把今天清零？"))return;
  data=load(); data.effective=0;data.raw=0;data.log=[]; save(data); render(); };

let calCur=new Date(), calMode="month", calSel=null;
function effOf(key){
  if(key===data.date) return {eff:data.effective,goal:data.goal};
  if(data.history[key]) return data.history[key];
  return {eff:0,goal:data.goal};
}
function renderCal(){
  const y=calCur.getFullYear(), m=calCur.getMonth();
  if(calMode==="year"){
    $("monthView").style.display="none"; $("yearView").style.display="block";
    $("calTitle").textContent=y+"年";
    const mo=$("months"); mo.innerHTML="";
    for(let i=0;i<12;i++){ const d=document.createElement("div");
      d.className="mo"+(i===new Date().getMonth()&&y===new Date().getFullYear()?" cur":"");
      d.textContent=(i+1)+"月";
      d.onclick=()=>{ calCur=new Date(y,i,1); calMode="month"; renderCal(); };
      mo.appendChild(d); }
    return;
  }
  $("monthView").style.display="block"; $("yearView").style.display="none";
  $("calTitle").textContent=y+"年"+(m+1)+"月";
  const g=$("grid"); g.innerHTML="";
  g.style.opacity=0; g.style.transform="translateX(12px)";
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){ const p=new Date(y,m,-(first-1-i)); g.appendChild(mkCell(p,true)); }
  for(let d=1;d<=days;d++) g.appendChild(mkCell(new Date(y,m,d),false));
  const tail=42-first-days;
  for(let i=1;i<=tail;i++) g.appendChild(mkCell(new Date(y,m+1,i),true));
  requestAnimationFrame(()=>{ g.style.opacity=1; g.style.transform="none"; });
}
function mkCell(dt,dim){
  const key=dt.toLocaleDateString("sv"); const o=effOf(key);
  const pct=o.goal?o.eff/o.goal*100:0;
  const c=document.createElement("div");
  c.className="cell"+(dim?" dim":"")+(key===todayStr()?" today":"")+(key===calSel?" sel":"");
  c.innerHTML=ring(pct,34,4)+`<span class="dnum">${dt.getDate()}</span>`;
  c.onclick=()=>{ calSel=key; renderCal();
    $("dbBig").textContent=o.eff+" / "+o.goal+" ml";
    $("dbSm").textContent=key+" · 完成度 "+Math.round(pct)+"%"+(pct>=100?" 🎉 达标":""); };
  return c;
}
$("prevBtn").onclick=()=>{ calMode==="year"?calCur.setFullYear(calCur.getFullYear()-1)
  :calCur.setMonth(calCur.getMonth()-1); renderCal(); };
$("nextBtn").onclick=()=>{ calMode==="year"?calCur.setFullYear(calCur.getFullYear()+1)
  :calCur.setMonth(calCur.getMonth()+1); renderCal(); };
$("calTitle").onclick=()=>{ calMode=calMode==="month"?"year":"month"; renderCal(); };

$("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  const go=b.dataset.go;
  document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  $("p-"+go).classList.add("on");
  if(go==="stat") renderCal(); if(go==="log") render();
});

/* ===== 提醒：原生(Capacitor) 优先，网页回退 ===== */
async function nativePerm(){
  const ln=LN(); if(!ln) return false;
  try{ let p=await ln.checkPermissions();
    if(p.display!=="granted") p=await ln.requestPermissions();
    return p.display==="granted"; }catch(e){ return false; }
}
async function nativeCancel(){
  const ln=LN(); if(!ln) return;
  try{ const p=await ln.getPending();
    if(p.notifications.length) await ln.cancel({notifications:p.notifications.map(n=>({id:n.id}))}); }catch(e){}
}
async function nativeSchedule(){
  const ln=LN(); if(!ln) return;
  await nativeCancel();
  const step=data.interval*60000, base=Date.now(), list=[];
  for(let i=1;i<=60;i++) list.push({ id:5000+i, title:"喝水时间",
    body:"💧 今日饮水目标尚未达成，记得喝水！", schedule:{ at:new Date(base+i*step) } });
  try{ await ln.schedule({notifications:list}); }catch(e){}
}
let timer=null,nextAt=0;
async function startRem(){
  data=load();
  if(isNative){
    const ok=await nativePerm();
    if(!ok){ alert("请在系统设置里允许通知"); data.remind=false; save(data);
      $("sw").classList.toggle("on",false); return; }
    await nativeSchedule();
  }else{
    if("Notification"in window&&Notification.permission!=="granted")
      await Notification.requestPermission();
  }
  stopTick();
  const ms=data.interval*60000; nextAt=Date.now()+ms;
  timer=setInterval(()=>{ if(!isNative) notifyWeb(); nextAt=Date.now()+ms;
    if(isNative) nativeSchedule(); },ms);
  tick();
}
function stopTick(){ if(timer)clearInterval(timer); timer=null; }
async function stopRem(){ stopTick(); nextAt=0; $("nextHint").textContent="提醒未开启";
  if(isNative) await nativeCancel(); }
function notifyWeb(){ data=load();
  const msg=data.effective>=data.goal?"🎉 今日饮水目标已达成，继续保持～"
    :`💧 今日饮水目标尚未达成，记得喝水！还差约 ${data.goal-data.effective} ml`;
  if("Notification"in window&&Notification.permission==="granted")
    new Notification("喝水时间",{body:msg}); else alert(msg); }
function tick(){ if(!nextAt)return; const l=Math.max(0,Math.round((nextAt-Date.now())/1000));
  $("nextHint").innerHTML=`下次提醒：<b>${Math.floor(l/60)} 分 ${String(l%60).padStart(2,"0")} 秒</b>后`; }
$("sw").onclick=async()=>{ data=load();
  if(!data.remind){ data.remind=true; save(data); $("sw").classList.add("on"); await startRem(); }
  else{ data.remind=false; save(data); $("sw").classList.remove("on"); await stopRem(); } };
setInterval(()=>{ if(nextAt)tick(); },1000);
setInterval(()=>{ if(data.date!==todayStr()){ data=load(); save(data); render(); } },30000);

buildDrinks(); render(); if(data.remind) startRem();

/* 注册 Service Worker（PWA 离线 + 可添加到主屏幕）；原生 App 内不需要 */
if(!isNative && "serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
